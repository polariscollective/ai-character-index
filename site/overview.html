<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overview, AI Constitutions Index</title>
<!-- The site's own mark, the same declaration the other four pages carry: the
     broken orbit knocked out in paper from an olive-deep rounded square. This
     page was the only one without it, so it alone fell back to the browser's
     blank default, and there is no favicon.ico to fall back on. Inline rather
     than a file, as everywhere else here, so the page stays movable. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect width=%2248%22 height=%2248%22 rx=%2210%22 fill=%22%23333D22%22/><g transform=%22translate(24,24) scale(0.84) translate(-24,-24)%22><path d=%22M32 10.14A16 16 0 1 1 16 10.14%22 fill=%22none%22 stroke=%22%23F1EFE3%22 stroke-width=%223.5%22 stroke-linecap=%22round%22/><path d=%22M24 4Q24 23 30.5 23Q24 23 24 32Q24 23 17.5 23Q24 23 24 4Z%22 fill=%22%23F1EFE3%22/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/board.css">
<link rel="stylesheet" href="/loader.css">
</head>
<body>
<!-- The reader's own header, the same markup in the same order, so that moving
     between the two pages reads as moving inside one site rather than arriving
     at another. The one piece deliberately left out is the reader's palette
     switch: this page carries no second palette, and a control that does
     nothing is worse than a control that is not there. -->
<header class="site-header">
  <span class="site-brand">
    <a class="mark-link" href="https://polariscollective.org" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true"><svg class="polaris-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M32 10.14A16 16 0 1 1 16 10.14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M24 4Q24 23 30.5 23Q24 23 24 32Q24 23 17.5 23Q24 23 24 4Z" fill="currentColor"/></svg></a>
    <span class="brand-stack">
      <a class="wordmark" href="/doc-reader/">AI Constitutions Index</a>
      <a class="collective" href="https://polariscollective.org" target="_blank" rel="noopener noreferrer">by Polaris Collective</a>
    </span>
  </span>
  <nav aria-label="Primary navigation">
    <a class="active" href="/" aria-current="page">Overview</a>
    <a href="/index" data-index-menu>Index</a>
    <a href="/doc-reader/">Doc reader</a>
    <a href="/about">About</a>
    <a href="/mcp">MCP</a>
  </nav>
</header>

<div class="shell">
  <!-- The page a reader meets first: what the index finds, on one page. Every
       word of it comes from overview.json, which a publication freezes like the
       two boards: see page-content.js. The markup keeps only where each part
       goes. -->
  <section id="view-overview">
  <h1 id="ovw-intro" data-menu="Intro" hidden data-needs-board></h1>
  <div id="ovw-lede" class="gov-lede" hidden data-needs-board></div>
  <p class="grid-note site-loading" id="ovw-status" aria-live="polite"><svg class="site-loader-mark" width="26" height="26" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="site-loader-ring" d="M32 10.14A16 16 0 1 1 16 10.14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M24 4Q24 23 30.5 23Q24 23 24 32Q24 23 17.5 23Q24 23 24 4Z" fill="currentColor"/></svg><span class="site-loader-text">Overview loading…</span></p>

  <!-- Four figures of the two boards, for every company, drawn by the same
       code as the boards of the Index (board.js), so a cell here is a cell
       there. overview.js reads the figures from the boards of the same
       publication, so they cannot disagree with the Index. -->
  <div class="gov-toolbar" hidden data-needs-board>
    <p class="gov-hint" id="ovw-mode-note"></p>
    <div class="ovw-mode" role="group" aria-label="Show the figures">
      <button type="button" class="gov-button" data-mode="relative" aria-pressed="true">Relative<span
        class="row-mark" aria-hidden="true">1</span></button>
      <button type="button" class="gov-button" data-mode="absolute" aria-pressed="false">Absolute</button>
    </div>
  </div>
  <div class="matrix-wrap" id="ovw-chart" data-menu="How companies stand" hidden data-needs-board>
    <table class="board ovw-board" id="ovw-grid">
      <caption class="visually-hidden" id="ovw-caption"></caption>
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <p class="grid-note slides-note" hidden data-needs-board>The board slides sideways to reach the other companies.</p>
  <div class="gov-legend" id="ovw-legend" aria-hidden="true" hidden data-needs-board></div>
  <!-- The notes the marks above point to, as the boards of the Index number
       their own. -->
  <ol class="gov-notes" id="ovw-notes" hidden data-needs-board></ol>

  <!-- One popover for the grid, filled with whatever was pressed. -->
  <div class="gov-pop" id="ovw-pop" popover role="dialog" aria-labelledby="ovw-pop-title" tabindex="-1"></div>

  <section class="ovw-takeaways" id="ovw-takeaways-section" data-menu="Main takeaways"
    aria-labelledby="ovw-takeaways-title" hidden data-needs-board>
    <h2 id="ovw-takeaways-title">Main takeaways</h2>
    <div class="ovw-takeaway-list" id="ovw-takeaways"></div>
  </section>
  <div id="ovw-sections"></div>
  </section>
</div>

<!-- The sections of the page, down the left margin on a wide screen, as on the
     index. overview.js fills it once the page is drawn. -->
<nav class="page-menu" id="page-menu" aria-label="Sections of this page"></nav>
<script type="module" src="/overview.js"></script>
<!-- The mark beside the wordmark. One file for every page. -->
<script type="module" src="/dev-tag.js"></script>
<!-- The wordmark's note and the header's menus. One file for every page. -->
<script type="module" src="/brand.js"></script>
<!-- The bubble at the bottom right. One file for every page. -->
<script type="module" src="/page-feedback.js"></script>
</body>
</html>
