<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The spec reader with passages scored for behaviour relevance by a panel of frontier models.">
  <title>Spec reader, AI Character Index</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22><rect width=%2248%22 height=%2248%22 rx=%2210%22 fill=%22%23333D22%22/><g transform=%22translate(24,24) scale(0.84) translate(-24,-24)%22><path d=%22M32 10.14A16 16 0 1 1 16 10.14%22 fill=%22none%22 stroke=%22%23F1EFE3%22 stroke-width=%223.5%22 stroke-linecap=%22round%22/><path d=%22M24 4Q24 23 30.5 23Q24 23 24 32Q24 23 17.5 23Q24 23 24 4Z%22 fill=%22%23F1EFE3%22/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-palette="daylight">
  <a class="skip-link" href="#document-reader">Skip to document</a>

  <header class="site-header">
    <span class="site-brand">
      <a class="mark-link" href="https://polariscollective.org" tabindex="-1" aria-hidden="true"><svg class="polaris-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M32 10.14A16 16 0 1 1 16 10.14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M24 4Q24 23 30.5 23Q24 23 24 32Q24 23 17.5 23Q24 23 24 4Z" fill="currentColor"/></svg></a>
      <a class="collective" href="https://polariscollective.org">Polaris Collective</a>
      <span class="brand-divider" aria-hidden="true"></span>
      <a class="wordmark" href="./">AI Character Index</a>
    </span>
    <nav aria-label="Primary navigation">
      <a class="active" href="./" aria-current="page">Spec reader</a>
      <a href="../methodology.html">Use the tool</a>
      <button class="mode" id="mode" type="button" aria-label="Switch to the umber night surface">☾</button>
    </nav>
  </header>

  <main class="app-shell">
    <aside id="behaviour-sidebar" class="behaviour-sidebar" aria-label="Behaviours under test">
      <div class="sidebar-intro">
        <h1 class="eyebrow">Spec reader</h1>
        <button
          id="sidebar-toggle"
          class="sidebar-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="behaviour-sidebar"
          aria-label="Hide the behaviour menu"
          title="Hide the behaviour menu"
        ><svg class="chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false"
          ><path d="M7.5 2 L3.5 6 L7.5 10" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div id="behaviour-toolbar" class="behaviour-toolbar" hidden>
        <span id="behaviour-count" class="behaviour-count" aria-live="polite">0 selected</span>
        <span class="behaviour-toolbar-actions">
          <button id="select-all-behaviours" type="button">All</button>
          <button id="clear-behaviours" type="button">None</button>
        </span>
      </div>
      <div id="behaviour-list" class="behaviour-list"></div>
      <div class="sidebar-export">
        <button
          id="download-passages"
          class="download-passages"
          type="button"
          title="Download a Markdown file with each ticked behaviour's definition and the passages shown for it under the current tier selection, in both specifications."
        >
          <span aria-hidden="true">↓</span> Download passages
        </button>
        <span id="download-hint" class="download-hint"></span>
      </div>
      <div class="sidebar-key">
        <button type="button" class="key-item" data-key="defining"><i class="key-swatch defining"></i> Defining</button>
        <button type="button" class="key-item" data-key="core"><i class="key-swatch core"></i> Core</button>
        <button type="button" class="key-item" data-key="related"><i class="key-swatch related"></i> Related</button>
        <button type="button" class="key-item" data-key="overlap"><i class="key-swatch overlap"></i> Shared</button>
        <button type="button" class="key-item" data-key="stipple"><i class="key-swatch stipple"></i> Guideline</button>
      </div>
      <details id="run-provenance" class="sidebar-run">
        <summary><span id="run-summary">Run details</span></summary>
        <dl id="run-detail" class="run-detail"></dl>
      </details>
    </aside>

    <div
      id="sidebar-resizer"
      class="column-resizer sidebar-resizer"
      role="separator"
      aria-label="Resize behaviour menu"
      aria-orientation="vertical"
      aria-valuemin="200"
      aria-valuemax="480"
      tabindex="0"
    ></div>

    <section class="workspace" aria-label="Specification reader">
      <div class="finding-bar" aria-live="polite">
        <div>
          <span class="finding-behaviour" id="finding-behaviour">Loading…</span>
          <span class="finding-definition" id="finding-definition"></span>
        </div>
        <div class="finding-actions">
          <button id="compare-toggle" class="compare-toggle" type="button" aria-pressed="false">
            <span class="split-icon" aria-hidden="true"></span>
            Compare
          </button>
        </div>
      </div>

      <div id="reader-status" class="reader-status" role="status"></div>
      <div id="document-reader" class="document-grid" tabindex="-1"></div>
    </section>
  </main>

  <div id="spec-picker" class="spec-picker" popover role="listbox" aria-label="Choose a specification"></div>

  <div id="key-note" class="key-note" popover>
    <h2 id="key-note-title" class="key-note-title"></h2>
    <div id="key-note-body" class="key-note-body"></div>
  </div>

  <footer class="site-footer">
    <span>Run by <a href="https://polariscollective.org">Polaris Collective</a>, started by <a href="https://github.com/AndresCotton">Andres Cotton</a>.</span>
    <span>The standalone original is <a href="https://ai-character-index.pages.dev">ai-character-index.pages.dev</a>, from <a href="https://github.com/AndresCotton/ai-character-index">AndresCotton/ai-character-index</a></span>
  </footer>

  <template id="document-template">
    <article class="document-panel">
      <header class="document-header">
        <div>
          <p class="document-lab"></p>
          <h2 class="document-title">
            <button class="document-picker" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="document-name"></span>
              <span class="picker-caret" aria-hidden="true"></span>
            </button>
          </h2>
        </div>
        <div class="document-meta">
          <div class="meta-top">
            <span class="document-version"></span>
            <span class="passage-nav">
              <span class="passage-count">Loading passages…</span>
              <button class="previous-passage" type="button" aria-label="Previous highlighted passage in this document">↑</button>
              <button class="next-passage" type="button" aria-label="Next highlighted passage in this document">↓</button>
            </span>
          </div>
          <button class="document-focus-toggle" type="button">Expand all</button>
          <span class="rail-legend" role="group" aria-label="Passage tiers shown">
            <button class="tier-toggle" type="button" data-tier="defining" aria-pressed="false"
              title="Passages the panel scored as defining for the behaviour"
              data-title-default="Passages the panel scored as defining for the behaviour">
              <i class="legend-mark defining" aria-hidden="true"></i> Defining<span class="tier-count"></span>
            </button>
            <button class="tier-toggle" type="button" data-tier="core" aria-pressed="false"
              title="Passages the panel unanimously scored as core"
              data-title-default="Passages the panel unanimously scored as core">
              <i class="legend-mark core" aria-hidden="true"></i> Core<span class="tier-count"></span>
            </button>
            <button class="tier-toggle" type="button" data-tier="related" aria-pressed="false"
              title="Passages with at least two judges behind them"
              data-title-default="Passages with at least two judges behind them">
              <i class="legend-mark adjacent" aria-hidden="true"></i> Related<span class="tier-count"></span>
            </button>
          </span>
          <a class="source-link" href="#" target="_blank" rel="noopener">Original</a>
        </div>
      </header>
      <div class="document-scroll">
        <div class="passage-rail" role="navigation" aria-label="Highlighted passages in this document"></div>
        <div class="document-body"></div>
      </div>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
  <script type="module" src="../shared/local-mode.js"></script>
</body>
</html>
