name: CI

# PR-time verification. Two jobs:
#
#   offline  -- the full no-network battery: panel + provenance + registry
#               suites, the tests/ suite (cite goldens, decoupling pins),
#               the data gate, byte-identity rebuilds, and the node app.js
#               harnesses. Stdlib python + node only.
#
#   browser  -- the two Playwright walkers (reader anchoring + reader feature
#               harness x bundled and user-extended data), which need a
#               real Chrome.
#
# No paths filter on purpose: a filtered required check never reports on PRs
# outside its paths, which blocks merging once branch protection requires it.
# The offline job is cheap (~1 min); always-on beats clever here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The python side is stdlib-only by design (validate_data.py falls
      # back to its built-in schema checker when jsonschema is absent), so
      # the runner's preinstalled python3 is all it needs.
      - name: Panel and citation suites
        run: |
          python3 engine/panel/test_panel.py
          python3 engine/panel/test_new_behaviour.py
          python3 -m unittest discover -s tests

      - name: Store and index suites
        run: |
          python3 engine/test_store.py
          python3 engine/test_index_store.py

      - name: Reader route suite
        run: node --test app/lib/__tests__/publications.test.mjs

      - name: app.js resolution harnesses
        run: |
          node engine/panel/test_appjs_fallthrough.js
          node engine/panel/test_appjs_tiers.js
          node engine/panel/test_appjs_quotes.js
          node engine/panel/test_appjs_wiring.js

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up pnpm + Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (playwright-core)
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Reader view walker
        run: node engine/verify-reader-test.mjs

      - name: Reader feature harness (bundled + user-extended)
        run: node engine/verify-reader-features.mjs
