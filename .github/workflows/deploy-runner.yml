# Build the judging job's image and point the Cloud Run Job at it.
#
# The image carries the engine and nothing else; the site is Vercel's and
# deploys on its own. This fires only when something the image contains changes,
# because a site-only commit has nothing to rebuild.
name: Deploy runner

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-runner.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-runner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # The same two names every Polaris application deploys under, and
          # repository variables rather than secrets: neither is one. A provider
          # path and a service account address are public facts about the project,
          # and what actually authorises this workflow is the identity binding in
          # polaris-tf naming this repository.
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/polaris-docker/ai-character-index-runner:${{ github.sha }}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Point the job at it
        run: |
          gcloud run jobs update ai-character-index-runner \
            --image "$IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT }}"
